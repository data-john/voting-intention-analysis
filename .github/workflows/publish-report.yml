name: Refresh and publish voting intention report

on:
  schedule:
    - cron: "17 2,8,14,20 * * *"
      timezone: Europe/London
    - cron: "17 9-13,15-19,21 * * 1"
      timezone: Europe/London
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false
  queue: max

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install analysis dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Download current tracker and refresh outputs
        run: python scripts/update.py --weeks 4 12 52 --published-status-url https://electionmodels.com/yougov/status.json

      - name: Build static report
        run: python scripts/build_site.py --require-source-check

      - name: Record source-check evidence
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          status = json.loads(Path("site/status.json").read_text())
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(f"YouGov successfully checked at {status['checked_at']}.\n\nLatest available poll: {status['latest_poll_date']}.\n")
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload report artifact
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_attempt }}
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

      - name: Verify the public report matches this source check
        run: python scripts/verify_publication.py
